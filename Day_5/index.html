<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <header id="marquee">
  <div class="marquee-lights" aria-hidden="true"></div>
  <h1>Rex&nbsp;Palace<span class="dot">·</span>Cinéma</h1>
  <p class="tagline">Choisissez vos places pour la séance</p>
  <div class="marquee-lights" aria-hidden="true"></div>

  <section class="now-showing">
    <div>
        <p class="eyebrow">Now Showing</p>
        <h2>Guardians of Time</h2>
    </div>

    <dl class="showtime">
        <div><dt>Room</dt><dd>3</dd></div>
        <div><dt>Time</dt><dd>7:30 PM</dd></div>
        div><dt>Date</dt><dd>Today</dd></div>
    </dl>
  </section>

  <div id="screen-wrap">
    <div id="SCREEN"></div>
  </div>
</header>
</body>
</html>
