<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <header id="marquee">
  <div class="marquee-lights" aria-hidden="true"></div>
  <h1>Flo&nbsp;Palace<span class="dot">·</span>Cinéma</h1>
  <p class="tagline">Choisissez vos places pour la séance</p>
  <div class="marquee-lights" aria-hidden="true"></div>
</header>

<main id="cinema">
  <section class="now-showing">
    <div>
        <p class="eyebrow">Now Showing</p>
        <h2>Guardians of Time</h2>
    </div>

    <dl class="showtime">
        <div><dt>Room</dt><dd>3</dd></div>
        <div><dt>Time</dt><dd>7:30 PM</dd></div>
        <div><dt>Date</dt><dd>Today</dd></div>
    </dl>
  </section>

  <div id="screen-wrap">
    <div id="screen">SCREEN</div>
  </div>

<div id="seat-map">
  <div class="row" data-row="A">
    <span class="row-label">A</span>
    <div class="seat-block">
      <div class="seat" data-seat="A1" data-price="2000"></div>
      <div class="seat" data-seat="A2" data-price="2000"></div>
      <div class="seat occupied" data-seat="A3" data-price="2000"></div>
      <div class="seat" data-seat="A4" data-price="2000"></div>
    </div>
    <div class="aisle" aria-hidden="true"></div>
    <div class="seat-block">
      <div class="seat" data-seat="A5" data-price="2000"></div>
      <div class="seat" data-seat="A6" data-price="2000"></div>
      <div class="seat" data-seat="A7" data-price="2000"></div>
      <div class="seat" data-seat="A8" data-price="2000"></div>
    </div>
    <span class="row-label">A</span>
  </div>
</div>

  <ul class="legend">
    <li><span class="swatch"></span>Available</li>
    <li><span class="swatch selected"></span>Selected</li>
    <li><span class="swatch occupied"></span>Reserved</li>
    <li><span class="swatch premium"></span>Premium</li>
  </ul>

  <section id="ticket-stub">
    <div class="stub-main">
        <p class="stub-eyebrow">Ticket</p>
        <h3 class="stub-film">Guardians of Time</h3>
        <p class="stub-meta">Room 3 &nbsp;·&nbsp; 7:30 PM &nbsp;·&nbsp; Today</p>

        <ul id="stub-seats"></ul>

        <div class="stub-total">
            <span>Total</span>
            <span id="stub-price">0&nbsp;FCFA</span>
        </div>
    </div>

    <div class="stub-perforation" aria-hidden="true"></div>

    <div class="stub-action">
        <button id="btn-reserve">Reserve my seats</button>
        <p id="status-message" role="status"></p>
    </div>
  </section>
</main>
  <script src="app.js"></script>
</body>
</html>
